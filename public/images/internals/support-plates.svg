<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Cross-section of a packing support plate carrying a random packing bed">
  <rect width="800" height="600" fill="#ffffff"/>
  <defs>
    <pattern id="mesh2" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 7 H14 M7 0 V14" stroke="#b8c6d6" stroke-width="1"/>
