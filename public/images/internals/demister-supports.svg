<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Cross-section of a wire mesh mist eliminator resting on a support beam and ring">
  <rect width="800" height="600" fill="#ffffff"/>
  <defs>
    <pattern id="mesh4" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 8 Q4 2 8 8 T16 8 M0 16 Q4 10 8 16 T16 16" stroke="#a8b9cc" stroke-width="1.2" fill="none"/>
      <path d="M0 0 Q4 -6 8 0 T16 0" stroke="#a8b9cc" stroke-width="1.2" fill="none"/>
    </pattern>
  </defs>

  <!-- column shell -->
  <line x1="200" y1="28" x2="200" y2="560" stroke="#1f3a5f" stroke-width="3"/>
  <line x1="600" y1="28" x2="600" y2="560" stroke="#1f3a5f" stroke-width="3"/>
  <g stroke="#b7c4d4" stroke-width="1">
    <line x1="186" y1="40" x2="200" y2="54"/><line x1="186" y1="76" x2="200" y2="90"/>
    <line x1="186" y1="112" x2="200" y2="126"/><line x1="186" y1="148" x2="200" y2="162"/>
    <line x1="186" y1="184" x2="200" y2="198"/><line x1="186" y1="220" x2="200" y2="234"/>
    <line x1="186" y1="256" x2="200" y2="270"/><line x1="186" y1="292" x2="200" y2="306"/>
    <line x1="186" y1="328" x2="200" y2="342"/><line x1="186" y1="364" x2="200" y2="378"/>
    <line x1="186" y1="400" x2="200" y2="414"/><line x1="186" y1="436" x2="200" y2="450"/>
    <line x1="186" y1="472" x2="200" y2="486"/><line x1="186" y1="508" x2="200" y2="522"/>
    <line x1="186" y1="544" x2="200" y2="558"/>
    <line x1="614" y1="40" x2="600" y2="54"/><line x1="614" y1="76" x2="600" y2="90"/>
    <line x1="614" y1="112" x2="600" y2="126"/><line x1="614" y1="148" x2="600" y2="162"/>
    <line x1="614" y1="184" x2="600" y2="198"/><line x1="614" y1="220" x2="600" y2="234"/>
    <line x1="614" y1="256" x2="600" y2="270"/><line x1="614" y1="292" x2="600" y2="306"/>
    <line x1="614" y1="328" x2="600" y2="342"/><line x1="614" y1="364" x2="600" y2="378"/>
    <line x1="614" y1="400" x2="600" y2="414"/><line x1="614" y1="436" x2="600" y2="450"/>
    <line x1="614" y1="472" x2="600" y2="486"/><line x1="614" y1="508" x2="600" y2="522"/>
    <line x1="614" y1="544" x2="600" y2="558"/>
  </g>

  <!-- gas out arrow at top -->
  <g stroke="#8a9aab" stroke-width="1.8" fill="none">
    <line x1="400" y1="96" x2="400" y2="36"/>
    <path d="M392 50 L400 34 L408 50"/>
  </g>
  <text x="418" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f3a5f" font-weight="600">Clean gas out</text>

  <!-- entrained droplets above pad -->
  <g fill="#4a7fb5" opacity="0.75">
    <circle cx="268" cy="120" r="3"/><circle cx="332" cy="138" r="2.6"/><circle cx="470" cy="126" r="3"/>
    <circle cx="536" cy="142" r="2.6"/><circle cx="300" cy="160" r="2.2"/><circle cx="500" cy="166" r="2.2"/>
  </g>

  <!-- mist eliminator pad -->
  <rect x="202" y="240" width="396" height="128" fill="url(#mesh4)" stroke="#1f3a5f" stroke-width="2"/>
  <rect x="202" y="240" width="396" height="128" fill="#dfe7f1" opacity="0.35"/>

  <!-- liquid draining from pad -->
  <g stroke="#4a7fb5" stroke-width="2.2" stroke-linecap="round">
    <line x1="238" y1="390" x2="238" y2="404"/>
    <line x1="400" y1="390" x2="400" y2="404"/>
    <line x1="562" y1="390" x2="562" y2="404"/>
  </g>
  <g fill="#4a7fb5">
    <circle cx="238" cy="412" r="3.4"/><circle cx="400" cy="412" r="3.4"/><circle cx="562" cy="412" r="3.4"/>
  </g>

  <!-- support ring -->
  <rect x="200" y="368" width="30" height="22" fill="#dfe7f1" stroke="#1f3a5f" stroke-width="2"/>
  <rect x="570" y="368" width="30" height="22" fill="#dfe7f1" stroke="#1f3a5f" stroke-width="2"/>

  <!-- support beam under the pad -->
  <rect x="228" y="374" width="344" height="14" fill="#cfdbe8" stroke="#1f3a5f" stroke-width="1.6"/>
  <g stroke="#1f3a5f" stroke-width="1.4">
    <line x1="260" y1="388" x2="300" y2="374"/>
    <line x1="330" y1="388" x2="370" y2="374"/>
    <line x1="400" y1="388" x2="400" y2="374"/>
    <line x1="430" y1="388" x2="470" y2="374"/>
    <line x1="500" y1="388" x2="540" y2="374"/>
  </g>

  <!-- gas upflow arrows below -->
  <g stroke="#8a9aab" stroke-width="1.6" fill="none">
    <line x1="300" y1="536" x2="300" y2="420"/><path d="M294 430 L300 418 L306 430"/>
    <line x1="400" y1="536" x2="400" y2="420"/><path d="M394 430 L400 418 L406 430"/>
    <line x1="500" y1="536" x2="500" y2="420"/><path d="M494 430 L500 418 L506 430"/>
  </g>

  <!-- labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f3a5f">
    <text x="176" y="300" text-anchor="end" font-weight="600">Wire mesh pad</text>
    <line x1="182" y1="296" x2="202" y2="292" stroke="#8a9aab" stroke-width="1"/>

    <text x="176" y="356" text-anchor="end">Pad thickness</text>
    <line x1="182" y1="352" x2="206" y2="348" stroke="#8a9aab" stroke-width="1"/>

    <text x="640" y="382" font-weight="600">Support ring</text>
    <line x1="636" y1="378" x2="602" y2="378" stroke="#8a9aab" stroke-width="1"/>

    <text x="176" y="408" text-anchor="end">Support beam</text>
    <line x1="182" y1="404" x2="230" y2="390" stroke="#8a9aab" stroke-width="1"/>

    <text x="176" y="470" text-anchor="end">Liquid drains back</text>
    <line x1="182" y1="466" x2="234" y2="416" stroke="#8a9aab" stroke-width="1"/>

    <text x="640" y="492">Dirty gas in</text>
  </g>

  <text x="400" y="584" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6a7c">
    The pad is only as good as its support: sagging or gaps at the ring let gas bypass and carry droplets straight through
  </text>
</svg>
